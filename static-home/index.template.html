<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#830000">
  <meta name="robots" content="noindex,follow">
  <title>Opening Update IT…</title>
  <meta http-equiv="refresh" content="0;url=__BACKEND_BASE_URL__/">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;color:#1a1a1a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(440px,calc(100% - 36px));text-align:center;padding:36px 28px;border:1px solid #e7e5e4;border-radius:24px;box-shadow:0 12px 36px -28px #1a1a1a66}
    .mark{width:52px;height:52px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:#830000;color:#fff;font-weight:800;font-size:25px}
    h1{font-size:24px;letter-spacing:-.04em;margin:0 0 10px}p{font-size:14px;line-height:1.7;color:#6b7280;margin:0 0 20px}
    .spinner{width:24px;height:24px;margin:0 auto 18px;border:3px solid #83000022;border-top-color:#830000;border-radius:50%;animation:spin .8s linear infinite}
    a{display:inline-block;background:#830000;color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:12px 20px}
    @keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">U</div>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Opening Update IT</h1>
    <p>Taking you to the official website. If the site is waking up, it may take a little longer on the first visit.</p>
    <a id="continue" href="__BACKEND_BASE_URL__/">Continue to Update IT</a>
  </main>
  <script>
    (function () {
      var link = document.getElementById('continue');
      // Navigating to the Django service is the actual wake-up request.
      // Let Render handle its normal cold-start/loading behavior.
      window.location.replace(link.href);
    })();
  </script>
</body>
</html>
